[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-service"
version = "0.4.0"
description = "Content & articles business module (CMS) — M4: domain model, lifecycle, versioning, taxonomy, content API."
requires-python = ">=3.11"
dependencies = [
    "atoz-backend-core==0.12.0",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
