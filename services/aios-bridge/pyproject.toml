[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-bridge"
version = "0.3.0"
description = "AI OS Bridge - the ONLY AI OS contact point for the AtozProductHub business layer. Transport only: validation, retry, timeout, health, auth. No AI logic."
requires-python = ">=3.11"
dependencies = [
    "atoz-backend-core==0.4.0",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
