# Prometheus scrape + SLO evaluation (M11 Phase D).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "atoz-services"
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
          - aios-bridge:8000
          - content-service:8000
          - affiliate-service:8000
          - pinterest-service:8000
          - seo-service:8000
          - analytics-service:8000
          - admin-service:8000
          - automation-service:8000
    relabel_configs:
      # Expose the service identity as a label for SLO alerts.
      - source_labels: [job]
        target_label: service
