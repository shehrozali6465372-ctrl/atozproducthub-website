name: atozproducthub

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  aios-bridge:
    build:
      context: ../..
      dockerfile: services/aios-bridge/Dockerfile
    ports:
      - "8100:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Placeholder until the AI OS endpoint is provisioned (never a secret here).
      AIOS_BASE_URL: http://aios:8100
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  content-service:
    build:
      context: ../..
      dockerfile: services/content-service/Dockerfile
    ports:
      - "8200:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Business data lives in the shared Postgres; content bodies stay in
      # the mounted object-store directory (Database Blueprint §2.1).
      DATABASE_URL: postgresql+asyncpg://atoz:atoz@postgres:5432/atoz
      CONTENT_STORAGE_DIR: /data/content
    volumes:
      - content_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  affiliate-service:
    build:
      context: ../..
      dockerfile: services/affiliate-service/Dockerfile
    ports:
      - "8300:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Business data lives in the shared Postgres (affiliate_db schema
      # tables are created by the affiliate-service migrations).
      DATABASE_URL: postgresql+asyncpg://atoz:atoz@postgres:5432/atoz
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  pinterest-service:
    build:
      context: ../..
      dockerfile: services/pinterest-service/Dockerfile
    ports:
      - "8400:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Business data lives in the shared Postgres (pinterest_db schema
      # tables are created by the pinterest-service migrations); token
      # VALUES stay out of the database (Vault boundary).
      DATABASE_URL: postgresql+asyncpg://atoz:atoz@postgres:5432/atoz
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atoz
      POSTGRES_USER: atoz
      POSTGRES_PASSWORD: atoz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  content_data:
