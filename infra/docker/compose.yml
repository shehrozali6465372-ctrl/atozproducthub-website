name: atozproducthub

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  aios-bridge:
    build:
      context: ../..
      dockerfile: services/aios-bridge/Dockerfile
    ports:
      - "8100:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Placeholder until the AI OS endpoint is provisioned (never a secret here).
      AIOS_BASE_URL: http://aios:8100
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  content-service:
    build:
      context: ../..
      dockerfile: services/content-service/Dockerfile
    ports:
      - "8200:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Business data lives in the shared Postgres; content bodies stay in
      # the mounted object-store directory (Database Blueprint §2.1).
      DATABASE_URL: postgresql+asyncpg://atoz:atoz@postgres:5432/atoz
      CONTENT_STORAGE_DIR: /data/content
    volumes:
      - content_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  affiliate-service:
    build:
      context: ../..
      dockerfile: services/affiliate-service/Dockerfile
    ports:
      - "8300:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Business data lives in the shared Postgres (affiliate_db schema
      # tables are created by the affiliate-service migrations).
      DATABASE_URL: postgresql+asyncpg://atoz:atoz@postgres:5432/atoz
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  pinterest-service:
    build:
      context: ../..
      dockerfile: services/pinterest-service/Dockerfile
    ports:
      - "8400:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Business data lives in the shared Postgres (pinterest_db schema
      # tables are created by the pinterest-service migrations); token
      # VALUES stay out of the database (Vault boundary).
      DATABASE_URL: postgresql+asyncpg://atoz:atoz@postgres:5432/atoz
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  seo-service:
    build:
      context: ../..
      dockerfile: services/seo-service/Dockerfile
    ports:
      - "8500:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Business data lives in the shared Postgres (seo_db schema tables are
      # created by the seo-service migrations); lexical search uses Typesense.
      DATABASE_URL: postgresql+asyncpg://atoz:atoz@postgres:5432/atoz
      TYPESENSE_API_BASE: http://typesense:8108
      TYPESENSE_API_KEY: dev-only-typesense-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  analytics-service:
    build:
      context: ../..
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "8600:8000"
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      # Operational ledger lives in the shared Postgres (analytics_db schema
      # tables are created by the analytics-service migrations); the event
      # backbone and warehouse are in-memory in dev unless enabled.
      DATABASE_URL: postgresql+asyncpg://atoz:atoz@postgres:5432/atoz
      KAFKA_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WAREHOUSE_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      EVENT_WEBHOOK_SECRET: dev-only-analytics-event-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      clickhouse:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atoz
      POSTGRES_USER: atoz
      POSTGRES_PASSWORD: atoz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  typesense:
    image: typesense/typesense:27.1
    ports:
      - "8108:8108"
    command: ["--data-dir", "/data", "--api-key", "dev-only-typesense-key-change-in-production", "--enable-cors"]
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8108'"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: bitnami/zookeeper:3.9
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo ruok | nc localhost 2181 | grep imok'"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'wget -qO- http://localhost:8123/ping | grep -q Ok'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  content_data:
  typesense_data:
  kafka_data:
  clickhouse_data:
