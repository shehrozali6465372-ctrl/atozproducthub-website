name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare (hosted runner)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_CONTENT_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_CONTENT_API_BASE_URL }}
      NEXT_PUBLIC_AFFILIATE_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_AFFILIATE_API_BASE_URL }}
      NEXT_PUBLIC_PINTEREST_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_PINTEREST_API_BASE_URL }}
      NEXT_PUBLIC_SEO_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SEO_API_BASE_URL }}
      NEXT_PUBLIC_NICHE_SLUG: ${{ secrets.NEXT_PUBLIC_NICHE_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check data source configuration
        run: |
          missing=""
          for name in NEXT_PUBLIC_CONTENT_API_BASE_URL NEXT_PUBLIC_AFFILIATE_API_BASE_URL NEXT_PUBLIC_PINTEREST_API_BASE_URL NEXT_PUBLIC_SEO_API_BASE_URL NEXT_PUBLIC_NICHE_SLUG; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing production data source secrets:$missing — site will deploy with mock data"
            echo "Add real API URLs as GitHub secrets to switch to live data. No code changes needed."
          else
            echo "All production data sources configured."
          fi

      - name: Build web app for Cloudflare (OpenNext)
        working-directory: apps/web
        run: npm run build

      - name: Build OpenNext Cloudflare bundle
        working-directory: apps/web
        run: npx --no-install opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        working-directory: apps/web
        run: npx --no-install wrangler deploy --config wrangler.jsonc
