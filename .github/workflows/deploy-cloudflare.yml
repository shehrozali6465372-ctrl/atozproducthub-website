name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare (hosted runner)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app for Cloudflare (OpenNext)
        working-directory: apps/web
        run: npm run build

      - name: Build OpenNext Cloudflare bundle
        working-directory: apps/web
        run: npx --no-install opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        working-directory: apps/web
        run: npx --no-install wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
