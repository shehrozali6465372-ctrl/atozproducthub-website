        run: python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify automation schema on PostgreSQL
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -c "\dt" | grep -E "automation_niches|automation_rules|automation_runs|aios_job_records"
      - name: Downgrade + re-upgrade (automation repeatable migrations)
        working-directory: services/automation-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: |
          python -m alembic -c db/migrations/alembic.ini downgrade base
          python -m alembic -c db/migrations/alembic.ini upgrade head

  recovery:
    name: Backup + restore drill (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atoz
          POSTGRES_USER: atoz
          POSTGRES_PASSWORD: atoz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atoz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Seed data
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -c "CREATE TABLE drill_check(id integer PRIMARY KEY, payload text);"
          psql -h localhost -U atoz -d atoz -c "INSERT INTO drill_check VALUES (1, 'recover-me');"
      - name: Backup
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: atoz
          PGDATABASE: atoz
          PGPASSWORD: atoz
          BACKUP_DIR: ./backups
        run: bash infra/db/backup.sh
      - name: Wipe target
        env:
          PGPASSWORD: atoz
        run: psql -h localhost -U atoz -d atoz -c "DROP TABLE drill_check;"
      - name: Restore
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: atoz
          PGDATABASE: atoz
          PGPASSWORD: atoz
          BACKUP_DIR: ./backups
        run: bash infra/db/restore.sh
      - name: Verify restored data
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -tAc "SELECT payload FROM drill_check WHERE id = 1;" | grep -q "recover-me"
          psql -h localhost -U atoz -d atoz -tAc "SELECT count(*) FROM drill_check;" | grep -q "1"

  frontend:
    name: Frontend (lint, types, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: "Build (next build: web + admin)"
        run: npm run build
      - name: Tests (vitest + axe)
        run: npm test

  docker:
    name: Docker build + compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t atoz-api:ci .
      - name: Build service images
        run: |
          for d in services/*/; do
            name="$(basename "$d")"
            docker build -f "$d/Dockerfile" -t "${name}:ci" .
          done
      - name: Validate production compose profile
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:ci-only@postgres:5432/atoz
          POSTGRES_DB: atoz
          POSTGRES_USER: atoz
          POSTGRES_PASSWORD: ci-only
          GATEWAY_JWT_SECRET: ci-only
          CONTENT_JWT_SECRET: ci-only
          AFFILIATE_JWT_SECRET: ci-only
          PINTEREST_JWT_SECRET: ci-only
          SEO_JWT_SECRET: ci-only
          ANALYTICS_JWT_SECRET: ci-only
          ADMIN_JWT_SECRET: ci-only
          AUTOMATION_JWT_SECRET: ci-only
          AFFILIATE_TOKEN_SIGNING_SECRET: ci-only
          AIOS_API_KEY: ci-only
          AIOS_BASE_URL: https://aios.invalid
          AIOS_BRIDGE_INTERNAL_TOKEN: ci-only
          ADMIN_INTERNAL_TOKEN: ci-only
          SEO_EVENT_SECRET: ci-only
          ANALYTICS_EVENT_SECRET: ci-only
          ADMIN_EVENT_SECRET: ci-only
          TYPESENSE_API_KEY: ci-only
          PINTEREST_OAUTH_CLIENT_ID: ci-only
          PINTEREST_OAUTH_STATE_SECRET: ci-only
        run: docker compose -f infra/docker/compose.prod.yml config -q
      - name: Compose up
        run: docker compose -f infra/docker/compose.yml up -d --build
      - name: Health check (api)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "api health OK"
              exit 0
            fi
            sleep 2
          done
          echo "api health check failed" >&2
          exit 1
      - name: Health check (aios-bridge)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8100/health; then
              echo "aios-bridge health OK"
              exit 0
            fi
            sleep 2
          done
          echo "aios-bridge health check failed" >&2
          exit 1
      - name: Health check (content-service)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8200/health; then
              echo "content-service health OK"
              exit 0
            fi
            sleep 2
          done
          echo "content-service health check failed" >&2
          exit 1
      - name: Health check (affiliate-service)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8300/health; then
              echo "affiliate-service health OK"
              exit 0
            fi
            sleep 2
          done
          echo "affiliate-service health check failed" >&2
          exit 1
      - name: Health check (pinterest-service)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8400/health; then
              echo "pinterest-service health OK"
              exit 0
            fi
            sleep 2
          done
          echo "pinterest-service health check failed" >&2
          exit 1
      - name: Health check (seo-service)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8500/health; then
              echo "seo-service health OK"
              exit 0
            fi
            sleep 2
          done
          echo "seo-service health check failed" >&2
          exit 1
      - name: Health check (analytics-service)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8600/health; then
              echo "analytics-service health OK"
              exit 0
            fi
            sleep 2
          done
          echo "analytics-service health check failed" >&2
          exit 1

      - name: Health check (admin-service)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8700/health; then
              echo "admin-service health OK"
              exit 0
            fi
            sleep 2
          done
          echo "admin-service health check failed" >&2
          exit 1
      - name: Health check (automation-service)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8800/health; then
              echo "automation-service health OK"
              exit 0
            fi
            sleep 2
          done
          echo "automation-service health check failed" >&2
          exit 1
      - name: Compose down
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v

  lighthouse:
    name: Lighthouse (Core Web Vitals + SEO gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        working-directory: apps/web
        run: npm run build
      - name: Install Lighthouse Chrome
        run: npx --yes @puppeteer/browsers install chrome@stable --path /tmp/chrome
      - name: Run Lighthouse audit
        env:
          CHROME_PATH: /tmp/chrome/chrome-linux64/chrome
        run: |
          cd apps/web
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000 > /dev/null 2>&1 && break
            sleep 2
          done
          cd ../..
          npx --yes lighthouse http://localhost:3000 --quiet --only-categories=performance,seo \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --output=json --output-path=/tmp/lighthouse.json --output-dir=/tmp
          node - <<'EOF'
          const report = require("/tmp/lighthouse.json");
          const scores = report.categories;
          console.log(
            "performance:", scores.performance.score,
            "| seo:", scores.seo.score,
          );
          if ((scores.seo.score ?? 0) < 0.8) {
            throw new Error("SEO score below the 0.8 gate");
          }
          if ((scores.performance.score ?? 0) < 0.4) {
            throw new Error("Performance score below the 0.4 gate");
          }
          EOF

  security:
    name: Security (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
