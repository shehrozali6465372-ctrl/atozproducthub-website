name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint, format, types, guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "libs/backend-core[dev]"
          pip install -e "apps/api[dev]"
          for s in services/*; do pip install -e "$s[dev]"; done
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: No-AI guard
        run: bash tools/dev/check-no-ai.sh
      - name: Contract validation
        run: bash tools/dev/check-contracts.sh
      - name: Infrastructure hardening guard
        run: bash tools/dev/check-infra.sh
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "libs/backend-core[dev]"
          pip install -e "apps/api[dev]"
          for s in services/*; do pip install -e "$s[dev]"; done
      - name: Run tests
        run: pytest

  database:
    name: Database (migrations on fresh PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atoz
          POSTGRES_USER: atoz
          POSTGRES_PASSWORD: atoz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atoz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "libs/backend-core[dev]"
          pip install -e "services/content-service[dev]"
          pip install -e "services/affiliate-service[dev]"
          pip install -e "services/pinterest-service[dev]"
          pip install -e "services/seo-service[dev]"
          pip install -e "services/analytics-service[dev]"
          pip install -e "services/admin-service[dev]"
          pip install -e "services/automation-service[dev]"
      - name: Verify single migration head
        working-directory: services/content-service
        run: python -m alembic -c db/migrations/alembic.ini heads | grep -c "(head)" | grep -q 1
      - name: Migrate fresh PostgreSQL (upgrade head)
        working-directory: services/content-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify schema on PostgreSQL
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -c "\dt" | grep -E "niches|articles|article_versions|categories|article_categories|tags|article_tags"
      - name: Verify single migration head (affiliate)
        working-directory: services/affiliate-service
        run: python -m alembic -c db/migrations/alembic.ini heads | grep -c "(head)" | grep -q 1
      - name: Migrate fresh PostgreSQL (affiliate upgrade head)
        working-directory: services/affiliate-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify affiliate schema on PostgreSQL
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -c "\dt" | grep -E "affiliate_niches|affiliate_networks|affiliate_merchants|affiliate_products|product_categories|product_category_links|affiliate_links|link_tokens|affiliate_clicks|click_attributions|revenue_transactions|revenue_reconciliations|revenue_summaries|affiliate_webhook_logs"
      - name: Downgrade + re-upgrade (affiliate repeatable migrations)
        working-directory: services/affiliate-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: |
          python -m alembic -c db/migrations/alembic.ini downgrade base
          python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify single migration head (pinterest)
        working-directory: services/pinterest-service
        run: python -m alembic -c db/migrations/alembic.ini heads | grep -c "(head)" | grep -q 1
      - name: Migrate fresh PostgreSQL (pinterest upgrade head)
        working-directory: services/pinterest-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify pinterest schema on PostgreSQL
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -c "\dt" | grep -E "pinterest_niches|pinterest_accounts|pinterest_tokens|pinterest_boards|board_sections|pinterest_pins|pin_queue_items|pin_publish_attempts|pinterest_analytics"
      - name: Downgrade + re-upgrade (pinterest repeatable migrations)
        working-directory: services/pinterest-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: |
          python -m alembic -c db/migrations/alembic.ini downgrade base
          python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify single migration head (seo)
        working-directory: services/seo-service
        run: python -m alembic -c db/migrations/alembic.ini heads | grep -c "(head)" | grep -q 1
      - name: Migrate fresh PostgreSQL (seo upgrade head)
        working-directory: services/seo-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify seo schema on PostgreSQL
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -c "\dt" | grep -E "seo_niches|url_registry|seo_metadata|sitemap_shards|seo_crawl_reports|seo_health_checks"
      - name: Downgrade + re-upgrade (seo repeatable migrations)
        working-directory: services/seo-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: |
          python -m alembic -c db/migrations/alembic.ini downgrade base
          python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify single migration head (analytics)
        working-directory: services/analytics-service
        run: python -m alembic -c db/migrations/alembic.ini heads | grep -c "(head)" | grep -q 1
      - name: Migrate fresh PostgreSQL (analytics upgrade head)
        working-directory: services/analytics-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify analytics schema on PostgreSQL
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -c "\dt" | grep -E "analytics_niches|analytics_event_ledger|traffic_daily|visitor_daily|daily_metrics|kpi_snapshots"
      - name: Downgrade + re-upgrade (analytics repeatable migrations)
        working-directory: services/analytics-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: |
          python -m alembic -c db/migrations/alembic.ini downgrade base
          python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Downgrade + re-upgrade (content repeatable migrations)
        working-directory: services/content-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: |
          python -m alembic -c db/migrations/alembic.ini downgrade base
          python -m alembic -c db/migrations/alembic.ini upgrade head

      - name: Verify single migration head (admin)
        working-directory: services/admin-service
        run: python -m alembic -c db/migrations/alembic.ini heads | grep -c "(head)" | grep -q 1
      - name: Migrate fresh PostgreSQL (admin upgrade head)
        working-directory: services/admin-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: python -m alembic -c db/migrations/alembic.ini upgrade head
      - name: Verify admin schema on PostgreSQL
        env:
          PGPASSWORD: atoz
        run: |
          psql -h localhost -U atoz -d atoz -c "\dt" | grep -E "admin_niches|admin_users|roles|permissions|role_permissions|user_roles|api_keys|audit_logs|notifications|queue_items|webhook_logs|operation_logs|scheduled_jobs|job_runs"
      - name: Downgrade + re-upgrade (admin repeatable migrations)
        working-directory: services/admin-service
        env:
          DATABASE_URL: postgresql+asyncpg://atoz:atoz@localhost:5432/atoz
        run: |
          python -m alembic -c db/migrations/alembic.ini downgrade base
          python -m alembic -c db/migrations/alembic.ini upgrade head

      - name: Verify single migration head (automation)
        working-directory: services/automation-service
        run: python -m alembic -c db/migrations/alembic.ini heads | grep -c "(head)" | grep -q 1
      - name: Migrate fresh PostgreSQL (automation upgrade head)
        working-directory: services/automation-service
        env:
